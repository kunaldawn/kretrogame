# The whole of ALSA's configuration inside kretro's runtime.
#
# alsa-lib reads /usr/share/alsa/alsa.conf by default, and that path is the
# host's once our tree is mounted somewhere else. The host's file then pulls in
# its own conf.d hooks, and those name plugins - pulse, pipewire, jack - as .so
# files built against the host's libc, which alsa-lib would dlopen into a
# process running ours. So this file replaces it outright
# (ALSA_CONFIG_PATH=<runtime>/usr/share/kretro/alsa/asound.conf) and says
# nothing but what alsa-lib can do on its own: talk to the card (hw), convert
# formats and rates (plug), and let more than one stream share it (dmix).
# Every one of those is built into libasound; nothing here loads a file.
#
# ALSA is Wine's second choice. Wine tries pulse first, and pipewire-pulse
# answers it on nearly every desktop; this is for the machine with neither.

pcm.hw {
	@args [ CARD DEV SUBDEV ]
	@args.CARD { type string default "0" }
	@args.DEV { type integer default 0 }
	@args.SUBDEV { type integer default -1 }
	type hw
	card $CARD
	device $DEV
	subdevice $SUBDEV
}

ctl.hw {
	@args [ CARD ]
	@args.CARD { type string default "0" }
	type hw
	card $CARD
}

pcm.plughw {
	@args [ CARD DEV SUBDEV ]
	@args.CARD { type string default "0" }
	@args.DEV { type integer default 0 }
	@args.SUBDEV { type integer default -1 }
	type plug
	slave.pcm {
		type hw
		card $CARD
		device $DEV
		subdevice $SUBDEV
	}
}

# dmix paces itself off the card's own timer, and it opens that timer by name
# (hw:CLASS=3,SCLASS=0,CARD=..,DEV=..). Nothing defines the name but the
# alsa.conf this file replaces, so without this dmix fails to open with
# "Unknown timer" on every card, and the default device with it. The values are
# alsa.conf's own defaults; dmix always passes all five.
timer.hw {
	@args [ CLASS SCLASS CARD DEV SUBDEV ]
	@args.CLASS { type integer default 2 }
	@args.SCLASS { type integer default 0 }
	@args.CARD { type string default "0" }
	@args.DEV { type integer default 0 }
	@args.SUBDEV { type integer default 0 }
	type hw
	class $CLASS
	sclass $SCLASS
	card $CARD
	device $DEV
	subdevice $SUBDEV
}

# One shared output per card. The ipc key is per user, so two users on one
# machine do not collide over the same segment.
pcm.dmix {
	@args [ CARD DEV ]
	@args.CARD { type string default "0" }
	@args.DEV { type integer default 0 }
	type dmix
	ipc_key 5678293
	ipc_key_add_uid true
	ipc_perm 0600
	slave {
		pcm {
			type hw
			card $CARD
			device $DEV
		}
		rate 48000
		period_size 1024
		buffer_size 4096
	}
}

pcm.!default {
	type plug
	slave.pcm "dmix"
}

ctl.!default {
	type hw
	card "0"
}
